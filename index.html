<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rocket Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: builder = parts palette | build canvas | stats and staging. Flight = full-bleed canvas with instruments at the edges. */
:root{
  --bg:#0a0e13; --panel:#111821; --panel2:#17212d; --line:#26323f;
  --fg:#d9e3ee; --mute:#7f90a4; --accent:#ffb03a; --accent-ink:#1a1100;
  --ok:#5fd38d; --bad:#ff5d5d; --cyan:#4fc3f7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.35 var(--display);font-weight:500;letter-spacing:.01em;overflow:hidden}
button,select{font:inherit;font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 11px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:disabled{background:var(--panel2);color:var(--mute);border-color:var(--line)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sm{padding:2px 7px;font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:400}
.k{color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#app{height:100%;position:relative}
section{position:absolute;inset:0}
#builder{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.bar h1{margin:0 14px 0 0;font-size:26px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.bar .sp{flex:1}
.bgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr) minmax(290px,350px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bgrid>*{min-height:0;min-width:0}
#left,#side{overflow:auto;background:var(--panel);padding:10px 12px}
#left{border-right:1px solid var(--line)}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#stage{position:relative;overflow:hidden;touch-action:none}
#bcanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#bhint{position:absolute;left:12px;bottom:10px;color:var(--mute);font-size:12px;background:rgba(10,14,19,.7);padding:4px 8px;border-radius:3px;max-width:70%}
#seltools{position:absolute;right:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#btoast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(10,14,19,.85);border:1px solid var(--line);padding:5px 12px;border-radius:3px;display:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{padding:4px 9px}
.card{display:grid;grid-template-columns:56px 1fr;gap:2px 10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:grab;touch-action:manipulation;user-select:none;border-radius:3px}
.card:hover{background:var(--panel2)}
.card canvas{width:56px;height:56px;grid-row:1/3;background:#0b1118;border-radius:3px}
.card b{font-size:16px;font-weight:600;align-self:end}
.card small{color:var(--mute);font-family:var(--mono);font-size:10.5px;line-height:1.35;align-self:start}
.pane h2{margin:0 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.pane .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}
.pane .row .num{font-size:13px}
.srow{margin:6px 0;border:1px solid var(--line);border-radius:3px;background:var(--panel2);min-height:40px}
.srow.over{border-color:var(--accent)}
.srow h3{margin:0;padding:3px 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap;padding:2px 6px 6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:1px 3px 1px 7px;font-size:13px;cursor:grab}
.chip.sel{border-color:var(--accent)}
.chip button{padding:0 5px;font-size:12px;border:0;background:transparent}
#lmsg{font-size:13px;color:var(--bad);min-height:18px}
#launch{font-size:20px;padding:10px;width:100%}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);margin-top:6px}
#modal{position:absolute;inset:0;background:rgba(5,8,12,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#modal .card2{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);padding:16px;width:min(560px,100%)}
#modal textarea{width:100%;height:180px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:12px var(--mono);padding:8px}
#modal h3{margin:0 0 8px;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
/* flight */
#fcanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;background:rgba(10,14,19,.72);border:1px solid var(--line);border-radius:4px;padding:8px 12px;backdrop-filter:blur(3px)}
.hud .row{display:flex;justify-content:space-between;gap:18px;align-items:baseline}
.hud .row .num{font-size:14px;min-width:86px;text-align:right}
#tel{top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));min-width:230px}
#orb{top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));min-width:250px}
#goals{top:calc(max(12px,env(safe-area-inset-top,0px)) + 175px);right:max(16px,env(safe-area-inset-right,0px));min-width:250px;font-size:13px}
#goals div{display:flex;gap:8px;align-items:baseline;color:var(--mute)}
#goals div.done{color:var(--ok)}
#msg{top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;max-width:34vw;font-size:15px;display:none}
#ctl{bottom:max(14px,env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:stretch}
#thr{writing-mode:vertical-lr;direction:rtl;height:130px;width:26px;accent-color:var(--accent)}
.col{display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.col .num{font-size:20px;color:var(--accent)}
#cmd{bottom:max(14px,env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.rowb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#stagebtn{font-size:22px;padding:8px 20px}
#stlist{bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:30vw;font-size:12px;color:var(--mute);text-align:center}
#stlist b{color:var(--accent);font-weight:600}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.6);padding:16px}
#over .card2{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);padding:22px 26px;max-width:460px;width:100%}
#over h3{margin:0 0 6px;font-size:30px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#over p{margin:0 0 14px;color:var(--mute);font-size:15px}
#over .rowb{justify-content:flex-start}
@media (max-width:980px){
  body{overflow:auto}
  section{position:relative;min-height:100%}
  #builder{height:auto}
  .bgrid{grid-template-columns:1fr}
  #stage{height:55vh}
  #left,#side{border:0}
  #flight{position:fixed}
  #stlist,#goals{display:none}
  #msg{max-width:60vw}
  .hud .row .num{min-width:64px;font-size:12px}
  #tel,#orb{min-width:0;padding:6px 8px}
  #orb{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:auto;bottom:max(180px,env(safe-area-inset-bottom,0px));display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app">
 <section id="builder">
  <div class="bar">
    <h1>Rocket Sandbox</h1>
    <button id="undo">Undo</button><button id="redo">Redo</button><button id="clear">Clear</button>
    <span class="sp"></span>
    <button id="symb" class="on" title="Mirror radial parts across the centre line (S)">Symmetry: on</button>
    <button id="exp">Export</button><button id="imp">Import</button>
  </div>
  <div class="bgrid">
    <aside id="left" aria-label="Parts"><div class="tabs" id="tabs"></div><div id="cards"></div></aside>
    <div id="stage"><canvas id="bcanvas"></canvas>
      <div id="seltools"><button id="rot">Rotate (R)</button><button id="flip">Flip (F)</button><button id="del">Delete</button></div>
      <div id="bhint">Drag parts onto the build area. They snap to touching edges. Click a part to select it, drag to move it. Wheel zooms, drag empty space to pan.</div>
      <div id="btoast" role="status"></div></div>
    <aside id="side">
      <div class="pane"><h2>Rocket</h2><div id="stats"></div></div>
      <div class="pane"><h2>Selected part</h2><div id="selinfo" class="num" style="font-size:12px;color:var(--mute)">None</div></div>
      <div class="pane"><h2>Staging <button class="sm" id="autos">Auto</button></h2><div id="stagepanel"></div></div>
      <div><button id="launch" class="primary">Launch</button><label class="chk"><input type="checkbox" id="startorb"> Start in a 100 km orbit (practice)</label><div id="lmsg" role="status"></div></div>
    </aside>
  </div>
 </section>
 <section id="flight" hidden>
  <canvas id="fcanvas"></canvas>
  <div id="tel" class="hud"></div>
  <div id="orb" class="hud"></div>
  <div id="goals" class="hud"></div>
  <div id="msg" class="hud"></div>
  <div id="ctl" class="hud">
    <input id="thr" type="range" min="0" max="100" value="0" orient="vertical" aria-label="Throttle">
    <div class="col"><div><div class="k">Throttle</div><div id="thrv" class="num">0%</div></div><button id="tfull">Full</button><button id="tcut">Cut</button></div>
    <div class="col"><div><div class="k">Fuel</div><div id="fuelv" class="num">0%</div></div><div class="k">Next stage</div><div id="stgv" class="num">1</div></div>
  </div>
  <div id="stlist" class="hud"></div>
  <div id="cmd" class="hud">
    <div class="rowb"><button id="rl" title="Turn counter-clockwise (A)">&#8634;</button><button id="rr" title="Turn clockwise (D)">&#8635;</button>
      <button id="sas0">Off</button><button id="sas1" class="on">Hold</button><button id="sas2">Pro</button><button id="sas3">Retro</button><button id="sas4">Radial</button></div>
    <div class="rowb"><button id="wdn">&laquo;</button><span id="warpv" class="num" style="min-width:76px;text-align:center;align-self:center">1x</span><button id="wup">&raquo;</button>
      <button id="zin">+</button><button id="zout">&minus;</button><button id="mapb">Map</button><button id="swb" title="Switch craft (Tab)">Switch</button></div>
    <div class="rowb"><button id="abort">Builder</button><button id="stagebtn" class="primary">Stage</button></div>
  </div>
  <div id="over"><div class="card2"><h3 id="otitle"></h3><p id="otext"></p><div class="rowb"><button id="ocont" class="primary"></button><button id="oretry">Rebuild</button></div></div></div>
 </section>
 <div id="modal"><div class="card2"><h3 id="mtitle"></h3><textarea id="mtext" spellcheck="false"></textarea><div class="rowb" style="margin-top:8px;justify-content:flex-end"><span id="mmsg" style="margin-right:auto;color:var(--mute);align-self:center"></span><button id="mok" class="primary">Load</button><button id="mclose">Close</button></div></div></div>
</div>
<script>
/* ===== constants, bodies, part catalogue, geometry ===== */
const G0=9.80665, TAU=Math.PI*2;
const BODIES={
  earth:{key:'earth',name:'Earth',R:6e5,mu:9.8*6e5*6e5,top:30000,rho0:1.2,H:5000,col:'#2f6f4f'},
  moon:{key:'moon',name:'Moon',R:2.5e5,mu:1.62*2.5e5*2.5e5,top:0,rho0:0,H:1,col:'#8d8f93'}
};
const MOON_A=3.84e7, MOON_N=Math.sqrt(BODIES.earth.mu/(MOON_A**3)), MOON_PHI0=Math.PI/2+1.0;
BODIES.moon.soi=MOON_A*Math.pow(BODIES.moon.mu/BODIES.earth.mu,.4);
function moonState(t){const a=MOON_PHI0+MOON_N*t;return{x:MOON_A*Math.cos(a),y:MOON_A*Math.sin(a),vx:-MOON_A*MOON_N*Math.sin(a),vy:MOON_A*MOON_N*Math.cos(a)};}
function density(bk,alt){const b=BODIES[bk];if(!b.top||alt>=b.top)return 0;return b.rho0*Math.exp(-Math.max(alt,0)/b.H)*(1-(Math.max(alt,0)/b.top)**2);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

/* part catalogue. w,h in metres (unrotated, engines point down). masses in kg, thrust in N */
const PARTS={}; const CATS=[['Pods'],['Tanks'],['Engines'],['Structure'],['Recovery']];
function def(o){o.key=o.key;PARTS[o.key]=Object.assign({cdAx:.6,cdSd:.9,tol:6,tmax:900,prop:0,dry:100},o);}
def({key:'capsule',name:'Capsule',cat:'Pods',kind:'pod',w:2,h:2.2,dry:1500,torque:9e3,tol:10,tmax:1400,cdAx:.3,info:'Crewed command pod'});
def({key:'probe',name:'Probe',cat:'Pods',kind:'pod',w:1,h:1,dry:250,torque:2e3,tol:6,tmax:1000,cdAx:.35,info:'Uncrewed controller'});
[[1,1],[1,2],[2,2],[2,4],[3,3],[3,6]].forEach(([w,h])=>{const prop=560*w*w*h;def({key:`t${w}${h}`,name:`Tank ${w}x${h}`,cat:'Tanks',kind:'tank',w,h,prop,dry:Math.round(prop*.06),cdAx:.55,tmax:800});});
def({key:'spark',name:'Spark',cat:'Engines',kind:'eng',w:1,h:1.2,dry:60,fvac:40e3,ispv:320,ispsl:280,gim:6,tol:7,tmax:1500,cdAx:.7,info:'Small lifter'});
def({key:'valiant',name:'Valiant',cat:'Engines',kind:'eng',w:1,h:1.6,dry:220,fvac:160e3,ispv:325,ispsl:285,gim:5,tol:7,tmax:1500,cdAx:.7,info:'Light booster engine'});
def({key:'hawk',name:'Hawk',cat:'Engines',kind:'eng',w:2,h:2.2,dry:700,fvac:600e3,ispv:330,ispsl:285,gim:4,tol:7,tmax:1500,cdAx:.7,info:'Medium booster engine'});
def({key:'titan',name:'Titan',cat:'Engines',kind:'eng',w:3,h:3,dry:2000,fvac:1800e3,ispv:335,ispsl:290,gim:3,tol:7,tmax:1500,cdAx:.7,info:'Heavy booster engine'});
def({key:'vac',name:'Vacuum-J',cat:'Engines',kind:'eng',w:2,h:2.4,dry:380,fvac:120e3,ispv:370,ispsl:140,gim:5,tol:7,tmax:1500,cdAx:.7,info:'Upper stage, poor at sea level'});
def({key:'srb1',name:'Booster S',cat:'Engines',kind:'eng',solid:true,w:1,h:5,dry:330,prop:4000,fvac:330e3,ispv:260,ispsl:235,gim:0,tol:7,tmax:1100,cdAx:.2,info:'Solid rocket, cannot throttle'});
def({key:'srb2',name:'Booster L',cat:'Engines',kind:'eng',solid:true,w:2,h:8,dry:1400,prop:20000,fvac:1500e3,ispv:260,ispsl:235,gim:0,tol:7,tmax:1100,cdAx:.2,info:'Solid rocket, cannot throttle'});
[1,2,3].forEach((w,i)=>{
  def({key:'nose'+w,name:'Nose cone '+w,cat:'Structure',kind:'nose',w,h:Math.round(w*14)/10,dry:[40,100,200][i],tmax:1800,cdAx:.12,info:'Reduces drag'});
  def({key:'sep'+w,name:'Separator '+w,cat:'Structure',kind:'sep',w,h:.3,dry:[40,90,160][i],tmax:800,cdAx:.6,info:'Splits the rocket when staged; blocks fuel flow'});
  def({key:'hs'+w,name:'Heat shield '+w,cat:'Structure',kind:'shield',tol:14,w,h:.5,dry:[120,300,600][i],tmax:3500,cdAx:.8,info:'Ablative, absorbs re-entry heat'});
});
def({key:'rsep',name:'Radial separator',cat:'Structure',kind:'sep',w:.4,h:1.2,dry:25,tmax:800,info:'Side separator for boosters'});
def({key:'wheel',name:'Reaction wheel',cat:'Structure',kind:'wheel',w:1,h:.6,dry:100,torque:6e3,tmax:900,info:'Extra turning torque'});
def({key:'chute',name:'Parachute',cat:'Recovery',kind:'chute',w:1,h:1,dry:120,tmax:600,cdAx:.5,info:'Opens when staged'});
def({key:'leg',name:'Landing leg',cat:'Recovery',kind:'leg',w:.5,h:1,dry:90,tol:14,tmax:900,info:'Radial; deploys when staged'});
const CHUTE_CDA=500, SEP_DV=1.2;
function partMass(d){return d.dry+d.prop}

/* ----- geometry of a placed part {key,x,y,rot,flip}. rot in degrees (CCW), builder coords: x right, y up ----- */
function dims(p){const d=PARTS[p.key],e=(p.rot%180===0);return{hw:(e?d.w:d.h)/2,hh:(e?d.h:d.w)/2};}
function dirOf(rot){const a=rot*Math.PI/180;return[-Math.sin(a),Math.cos(a)];}
function axHalf(p){const d=PARTS[p.key];return(p.rot%180===0?d.h:d.w)/2;}
function overlapAmt(a,b){const A=dims(a),B=dims(b);return[(A.hw+B.hw)-Math.abs(a.x-b.x),(A.hh+B.hh)-Math.abs(a.y-b.y)];}
const EPS=.08;
function touching(a,b){const[ox,oy]=overlapAmt(a,b);return(Math.abs(ox)<=EPS&&oy>=.15)||(Math.abs(oy)<=EPS&&ox>=.15)||(ox>EPS&&oy>EPS);}
function overlapping(a,b){const[ox,oy]=overlapAmt(a,b);return ox>.06&&oy>.06;}
/* snapping: find a spot touching an existing part, close to the cursor */
function snapPlace(key,rot,cx,cy,others,sym){
  const probe={key,rot,x:cx,y:cy}, P=dims(probe);
  if(!others.length)return{x:Math.abs(cx)<.5?0:cx,y:cy,ok:true,attached:false};
  let best=null,bd=1e9;
  const tryC=(x,y)=>{
    const d=Math.hypot(x-cx,y-cy); if(d>=bd||d>1.4)return;
    const t={key,rot,x,y};
    if(others.some(o=>overlapping(t,o)))return;
    if(sym&&Math.abs(x)>1e-6){const m={key,rot,x:-x,y};if(Math.abs(x)<P.hw+.05||overlapping(t,m)||others.some(o=>overlapping(m,o)))return;}
    bd=d;best={x,y,ok:true,attached:true};
  };
  others.forEach(q=>{
    const Q=dims(q);
    [1,-1].forEach(s=>{
      const x=q.x+s*(Q.hw+P.hw);
      [q.y,q.y+Q.hh-P.hh,q.y-Q.hh+P.hh,clamp(cy,q.y-Q.hh-P.hh+.2,q.y+Q.hh+P.hh-.2)].forEach(y=>tryC(x,y));
      const y2=q.y+s*(Q.hh+P.hh);
      [q.x,0,q.x+Q.hw-P.hw,q.x-Q.hw+P.hw,clamp(cx,q.x-Q.hw-P.hw+.2,q.x+Q.hw+P.hw-.2)].forEach(x2=>tryC(x2,y2));
    });
  });
  if(best)return best;
  // nothing close enough to snap to: place freely in mid-air if it does not overlap anything
  const t={key,rot,x:cx,y:cy},m={key,rot,x:-cx,y:cy};
  const clash=others.some(o=>overlapping(t,o))||(sym&&Math.abs(cx)>1e-6&&(Math.abs(cx)<P.hw+.05||others.some(o=>overlapping(m,o))));
  return{x:cx,y:cy,ok:!clash,attached:false};
}
/* default staging heuristic: ignite lowest engines at stage 1, then each separator with the next engines; recovery last */
function autoStage(parts){
  const seps=parts.filter(p=>PARTS[p.key].kind==='sep').sort((a,b)=>a.y-b.y);
  let top=1;
  parts.forEach(p=>{
    const k=PARTS[p.key].kind;
    if(k==='eng'){p.stage=1+seps.filter(s=>s.y<p.y-.01).length;}
    else if(k==='sep'){p.stage=2+seps.filter(s=>s.y<p.y-.01).length;}
    else p.stage=0;
    top=Math.max(top,p.stage);
  });

$('mapb').onclick=()=>{VIEW.mode=VIEW.mode==='map'?'flight':'map';setViewBtn();};
function maxWarp(){
  const c=SIM.main;if(!c||SIM.status!=='flying'||c.sleep||c.grounded)return 1;
  const B=BODIES[c.body],alt=Math.hypot(c.x,c.y)-B.R;
  if(c.thrust>0||SIM.crafts.some(k=>k.thrust>0))return 4;
  if(alt<(B.top||0)+2000||alt<4000)return 4;
  return 100000;
}
function warpStep(d){const i=WARPS.indexOf(SIM.warp),n=clamp(i+d,0,WARPS.length-1);if(WARPS[n]<=maxWarp())SIM.warp=WARPS[n];else say('Time warp is limited while thrusting, near the ground or in the atmosphere.');}
$('wup').onclick=()=>warpStep(1);$('wdn').onclick=()=>warpStep(-1);
function zoomBy(k){if(VIEW.mode==='map')VIEW.mzoom=clamp(VIEW.mzoom*k,.2,200);else VIEW.zoom=clamp((VIEW.zoom||1)*k,2e-5,60);}
$('zin').onclick=()=>zoomBy(1.4);$('zout').onclick=()=>zoomBy(1/1.4);
$('fcanvas').addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.15:1/1.15);},{passive:false});
function switchCraft(){const l=SIM.crafts.filter(c=>!c.gone);if(l.length<2)return;SIM.main=l[(l.indexOf(SIM.main)+1)%l.length];SIM.hold=SIM.main.th;VIEW.zoom=null;say('Switched craft.',2);}
$('swb').onclick=switchCraft;
[['rl',1],['rr',-1]].forEach(([id,v])=>{const b=$(id);b.addEventListener('pointerdown',e=>{btnRot=v;b.setPointerCapture(e.pointerId);});['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,()=>{btnRot=0;}));});
window.addEventListener('keydown',e=>{
  if($('flight').hidden||/input|textarea|select/i.test(e.target.tagName)&&e.target.id!=='thr')return;
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','tab'].includes(k))e.preventDefault();
  if(e.repeat&&[' ','m','z','x',',','.','tab'].includes(k))return;
  keys.add(k);
  if(k===' ')fireStage();else if(k==='z')setThr(1);else if(k==='x')setThr(0);else if(k==='m')$('mapb').click();
  else if(k===','||k==='<')warpStep(-1);else if(k==='.'||k==='>')warpStep(1);else if(k==='+'||k==='=')zoomBy(1.4);else if(k==='-'||k==='_')zoomBy(1/1.4);else if(k==='tab')switchCraft();
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());
/* goals */
function updateGoals(){
  const c=SIM.main;if(!c||SIM.status!=='flying'||!c.hasPod)return;
  const B=BODIES[c.body],r=Math.hypot(c.x,c.y),alt=r-B.R,o=elements(c.x,c.y,c.vx,c.vy,B.mu),G=SIM.goals;
  const win=k=>{if(!G[k]){G[k]=true;say('Goal complete: '+GOALS.find(g=>g[0]===k)[1],6);}};
  if(c.body==='earth'){SIM.maxAlt=Math.max(SIM.maxAlt,alt);if(alt>30000)win('space');if(o.bound&&o.rp-B.R>35e3&&!c.grounded)win('orbit');
    if(G.orbit&&c.grounded&&c.sleep)win('home');}
  else{win('moonsoi');if(o.bound&&o.rp-B.R>10e3&&!c.grounded)win('moonorbit');if(c.grounded&&c.sleep)win('moonland');}
}
function showOver(){
  overShown=true;$('over').style.display='flex';$('otitle').textContent='Rocket lost';
  $('otext').textContent='The command pod was destroyed. Rebuild with a different design, or relaunch the same rocket.';
  $('ocont').textContent='Relaunch';$('ocont').onclick=startFlight;
}
/* HUD */
const row=(k,v)=>`<div class="row"><span class="k">${k}</span><span class="num">${v}</span></div>`;
const dist=v=>Math.abs(v)<10000?fmt(v)+' m':fmt(v/1000,1)+' km';
function hud(){
  const c=SIM.main,B=BODIES[c.body],r=Math.hypot(c.x,c.y),alt=r-B.R,ux=c.x/r,uy=c.y/r,v=Math.hypot(c.vx,c.vy),vr=c.vx*ux+c.vy*uy,hv=Math.sqrt(Math.max(0,v*v-vr*vr));
  const g=B.mu/(r*r),twr=thrustAvail(c)/(c.m*g),heat=c.heat||0;
  $('tel').innerHTML=row('Body',B.name)+row('Altitude',dist(Math.max(0,alt-(c.grounded||alt<60?c.cy-lowestY(c.parts):0))))+row('Speed',fmt(v)+' m/s')+row('Vertical speed',fmt(vr)+' m/s')+row('Horizontal speed',fmt(hv)+' m/s')+row('Mass',fmt(c.m)+' kg')+row('Thrust / weight',fmt(twr,2))+row('Hottest part',`<span style="color:${heat>.8?'var(--bad)':'inherit'}">${fmt(heat*100)}%</span>`)+row('Mission time','T+'+fmt(SIM.t)+' s');
  const o=elements(c.x,c.y,c.vx,c.vy,B.mu);
  $('orb').innerHTML=row('Apoapsis',o.bound?dist(o.ra-B.R):'escape')+row('Periapsis',dist(o.rp-B.R))+row('Period',o.bound?(o.T>7200?fmt(o.T/3600,1)+' h':fmt(o.T/60,1)+' min'):'-')+row('Eccentricity',fmt(o.e,3));
  $('goals').innerHTML='<div class="k" style="margin-bottom:3px">Mission goals</div>'+GOALS.map(([k,t])=>`<div class="${SIM.goals[k]?'done':''}"><span>${SIM.goals[k]?'&#10003;':'&#9675;'}</span><span>${t}</span></div>`).join('');
  $('thrv').textContent=Math.round(SIM.throttle*100)+'%';
  const left=c.parts.reduce((a,p)=>a+(p.d.kind==='tank'||p.d.solid?p.prop:0),0);$('fuelv').textContent=fmt(100*left/(SIM.fuel0||1))+'%';
  const nums=stageNumbers().filter(x=>x>=SIM.stageNo);$('stgv').textContent=nums.length?nums[0]:'-';
  $('stlist').innerHTML=nums.length?nums.slice(0,3).map((n,i)=>`<div>${i===0?'<b>Next · ':''}Stage ${n}${i===0?'</b>':''}: ${c.parts.filter(p=>p.stage===n&&ACTIVATABLE(p.d.kind)&&!p.used).map(p=>p.d.name).join(', ')}</div>`).join(''):'No stages left';
  $('warpv').textContent=SIM.warp.toLocaleString('en-US')+'x';
  const ms=$('msg');if(SIM.msgT>0&&SIM.msg){ms.style.display='block';ms.textContent=SIM.msg;}else ms.style.display='none';
  $('swb').disabled=SIM.crafts.length<2;
}
function thrustAvail(c){const B=BODIES[c.body],rho=density(c.body,Math.hypot(c.x,c.y)-B.R),ratio=B.rho0?clamp(rho/B.rho0,0,1):0;
  return c.parts.reduce((s,p)=>{const d=p.d;if(d.kind!=='eng')return s;if(d.solid?p.prop<=0:!(c.feed.get(p)||[]).some(t=>t.prop>0))return s;return s+d.fvac/d.ispv*(d.ispv-(d.ispv-d.ispsl)*ratio);},0);}
/* ----- frame ----- */
function simFrame(dtF){
  if(SIM.msgT>0)SIM.msgT-=dtF;
  if(SIM.status!=='flying'){SIM.fx.forEach(f=>f.t+=dtF);SIM.fx=SIM.fx.filter(f=>f.t<2.5);return;}
  const c=SIM.main;SIM.warp=Math.min(SIM.warp,maxWarp());
  const B=BODIES[c.body],r=Math.hypot(c.x,c.y),alt=r-B.R,total=dtF*SIM.warp;
  const base=(c.thrust>0||c.grounded||alt<(B.top||0)+3000||alt<4000||SIM.crafts.some(k=>k.thrust>0))?.02:clamp(.03*Math.sqrt(r*r*r/B.mu),.05,60);
  const n=Math.min(600,Math.max(1,Math.ceil(total/base))),dt=total/n;
  for(let i=0;i<n;i++){stepSim(dt);if(SIM.main.gone)break;}
  cleanup();updateGoals();
}
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(!$('flight').hidden&&SIM.main){
    if(SIM.status==='flying'){
      SIM.rotIn=btnRot||((keys.has('a')||keys.has('arrowleft')?1:0)-(keys.has('d')||keys.has('arrowright')?1:0));
      if(prevRot!==0&&SIM.rotIn===0&&SIM.main)SIM.hold=SIM.main.th;prevRot=SIM.rotIn;
      const tr=(keys.has('shift')?1:0)-(keys.has('control')?1:0);if(tr)setThr(SIM.throttle+tr*.6*dt);
    }
    simFrame(dt);
    if(SIM.status==='lost'&&!overShown)showOver();
    const[ctx,w,h]=fit($('fcanvas'));
    if(VIEW.mode==='map')drawMap(ctx,w,h);else drawFlight(ctx,w,h);
    hud();
  }
  requestAnimationFrame(loop);
}
initBuilder();requestAnimationFrame(loop);
</script>

</body></html>
